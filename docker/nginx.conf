server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed build assets: cache forever.
  location ~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
  location = /embed.js { add_header Cache-Control "public, max-age=300"; add_header Access-Control-Allow-Origin *; }
  # Configurator runs in third-party iframes. Restrict embedding per deployment with
  # Content-Security-Policy frame-ancestors (in addition to tenant.embedOrigins, D-055).
  location /configurator/ { try_files $uri $uri/ /configurator/index.html; add_header Cache-Control "no-cache"; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; add_header Cache-Control "no-cache"; add_header X-Frame-Options DENY always; add_header Content-Security-Policy "frame-ancestors 'none'" always; }
  location = / { add_header Cache-Control "no-cache"; }
}
